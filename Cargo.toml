[package]
edition      = "2024"
name         = "embassy"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "embassy"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c3", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }
esp-alloc = { version = "0.11.0", features = ["esp32c3"] }

esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "esp-alloc",
  "esp32c3",
  "unstable",
] }

trouble-host = { version = "0.8.0", features = ["gatt", "security", "default-packet-pool-mtu-255"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
embassy-futures = "0.1"

esp-backtrace = { version = "0.20.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
log = "0.4.35"

embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c", features = [
    "embassy-crypto-aes128-ecb",
    "embassy-crypto-aes128-cmac",
    "embassy-crypto-p256-ecdh",
] }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c" }
rand_chacha = { version = "0.3", default-features = false }
embassy-sync = "0.8.0"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
